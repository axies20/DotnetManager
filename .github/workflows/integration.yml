name: Container integration

on:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  test:
    name: Container integration test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Podman when unavailable
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes podman
          fi
          podman info

      - name: Run container integration test
        env:
          DOTNET_MANAGER_RUN_CONTAINER_TESTS: 1
        run: >-
          dotnet test Tests/DotnetManager.IntegrationTests/DotnetManager.IntegrationTests.csproj
          --configuration Release
          --logger "trx;LogFileName=container-integration-tests.trx"
          --results-directory artifacts/test-results/container-integration

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-integration-test-results
          path: artifacts/test-results/container-integration
          if-no-files-found: warn
          retention-days: 14
