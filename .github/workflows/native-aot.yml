name: Native AOT

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-aot-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  smoke-test:
    name: Native AOT smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish native executable
        run: >-
          dotnet publish DotnetManager/DotnetManager.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output artifacts/publish

      - name: Run native executable
        run: ./artifacts/publish/dnm --help
