name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck bsdextrautils

      - name: Check shell syntax
        run: bash -n bin/dotnet-manager install.sh uninstall.sh tests/test.sh

      - name: Run ShellCheck
        run: shellcheck bin/dotnet-manager install.sh uninstall.sh tests/test.sh

      - name: Run integration tests
        run: ./tests/test.sh
