name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish native executable
        shell: bash
        run: |
          dotnet publish DotnetManager/DotnetManager.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            --output publish
          mv publish/DotnetManager publish/dotnet-manager
          tar -czf "dotnet-manager-${{ matrix.rid }}.tar.gz" \
            -C publish dotnet-manager appsettings.json
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dotnet-manager-${{ matrix.rid }}.tar.gz" > \
              "dotnet-manager-${{ matrix.rid }}.tar.gz.sha256"
          else
            shasum -a 256 "dotnet-manager-${{ matrix.rid }}.tar.gz" > \
              "dotnet-manager-${{ matrix.rid }}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-manager-${{ matrix.rid }}
          path: |
            dotnet-manager-${{ matrix.rid }}.tar.gz
            dotnet-manager-${{ matrix.rid }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dotnet-manager-*
          merge-multiple: true
          path: artifacts

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" artifacts/*
          --repo "${{ github.repository }}"
          --generate-notes
