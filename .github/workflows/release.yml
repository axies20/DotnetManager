name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore and audit dependencies
        run: >-
          dotnet restore DotnetManager.slnx
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=moderate
          -warnaserror:NU1900,NU1902,NU1903,NU1904,NU1905

      - name: Verify formatting
        run: dotnet format DotnetManager.slnx --verify-no-changes --no-restore

      - name: Build
        run: >-
          dotnet build DotnetManager.slnx
          --configuration Release
          --no-restore
          --warnaserror

      - name: Test
        run: >-
          dotnet test DotnetManager.slnx
          --configuration Release
          --no-build
          --no-restore

  publish:
    name: Publish ${{ matrix.rid }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish native executable
        shell: bash
        run: |
          dotnet publish DotnetManager/DotnetManager.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            --output publish
          tar -czf "dotnet-manager-${{ matrix.rid }}.tar.gz" \
            -C publish dnm
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dotnet-manager-${{ matrix.rid }}.tar.gz" > \
              "dotnet-manager-${{ matrix.rid }}.tar.gz.sha256"
          else
            shasum -a 256 "dotnet-manager-${{ matrix.rid }}.tar.gz" > \
              "dotnet-manager-${{ matrix.rid }}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-manager-${{ matrix.rid }}
          path: |
            dotnet-manager-${{ matrix.rid }}.tar.gz
            dotnet-manager-${{ matrix.rid }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dotnet-manager-*
          merge-multiple: true
          path: artifacts

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" artifacts/*
          --repo "${{ github.repository }}"
          --generate-notes
